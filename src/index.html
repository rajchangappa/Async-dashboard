<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore the films, filmmakers, and stories of Studio Ghibli."
    />
    <title>Studio Ghibli — Film Library</title>
    <link rel="stylesheet" href="./output.css" />
    <script type="module" src="./script.js"></script>
  </head>
  <body class="min-h-screen bg-[#111111] text-stone-100 antialiased">
    <header class="border-b border-white/10 bg-[#111111]">
      <div
        class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5 sm:px-8"
      >
        <a
          href="#"
          class="flex items-center gap-3"
          aria-label="Ghibli Films home"
        >
          <span class="h-7 w-1 rounded-full bg-orange-500"></span>
          <span
            class="text-sm font-semibold tracking-[0.18em] text-white uppercase"
            >Ghibli Films</span
          >
        </a>
        <a
          href="#films"
          class="text-sm text-stone-400 transition-colors hover:text-white"
          >The collection</a
        >
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-5 pb-20 sm:px-8">
      <section class="py-14 sm:py-20 lg:py-24" aria-labelledby="page-title">
        <p
          class="mb-5 text-xs font-semibold tracking-[0.22em] text-orange-400 uppercase"
        >
          A world of stories
        </p>
        <div class="max-w-3xl">
          <h1
            id="page-title"
            class="font-serif text-4xl leading-tight font-medium tracking-tight text-white sm:text-5xl lg:text-6xl"
          >
            The Studio Ghibli<br class="hidden sm:block" />
            film collection
          </h1>
          <p
            class="mt-6 max-w-xl text-base leading-7 text-stone-400 sm:text-lg"
          >
            Meet the films, the people behind them, and the worlds that stay
            with you long after the credits.
          </p>
        </div>
        <div class="mt-10 h-px w-full bg-white/10"></div>
      </section>

      <section id="films" aria-labelledby="films-title">
        <div
          class="mb-6 flex flex-col gap-2 sm:mb-8 sm:flex-row sm:items-end sm:justify-between"
        >
          <div>
            <p
              class="mb-2 text-xs font-semibold tracking-[0.18em] text-orange-400 uppercase"
            >
              Explore the archive
            </p>
            <h2
              id="films-title"
              class="text-2xl font-semibold tracking-tight text-white"
            >
              Films
            </h2>
          </div>
          <p class="text-sm text-stone-500">
            Stories for every kind of wonder.
          </p>
        </div>

        <div
          id="movies-container"
          class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 lg:gap-6"
        ></div>
      </section>
    </main>
  </body>
</html>
